<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('vehiculos')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Vehículos</h1>
        <a class="btn btn-primary" th:href="@{/vehiculos/nuevo}">Nuevo vehículo</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/vehiculos}" method="get">
        <div class="col-sm-8 col-md-5">
            <input type="text" name="patente" class="form-control"
                   placeholder="Buscar por patente" th:value="${patente}">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
            <a class="btn btn-link" th:href="@{/vehiculos}">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>Patente</th>
                <th>Vehículo</th>
                <th>Año</th>
                <th>Dueño</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${vehiculos}">
                <td th:text="${v.patente}">AB123CD</td>
                <td th:text="${v.marca + ' ' + v.modelo}">Ford Fiesta</td>
                <td th:text="${v.anio}">2018</td>
                <td>
                    <a th:href="@{/clientes/{id}(id=${v.cliente.id})}"
                       th:text="${v.cliente.apellido + ', ' + v.cliente.nombre}">Pérez, Juan</a>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/vehiculos/{id}(id=${v.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/vehiculos/{id}/editar(id=${v.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/vehiculos/{id}/eliminar(id=${v.id})}"
                          onsubmit="return confirm('¿Seguro que desea eliminar este vehículo?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(vehiculos)}">
                <td colspan="5" class="text-center text-muted py-4">No hay vehículos para mostrar.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
