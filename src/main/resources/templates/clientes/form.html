<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<main class="container py-4" style="max-width: 640px;">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <h1 class="h3 mb-3" th:text="${titulo}">Cliente</h1>

    <form th:action="@{${accion}}" th:object="${form}" method="post" class="card card-body">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" maxlength="50" required>
        </div>
        <div class="mb-3">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" th:field="*{apellido}" class="form-control" maxlength="50" required>
        </div>
        <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="text" th:field="*{telefono}" class="form-control" maxlength="20" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
