<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('inicio')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <h1 class="h3 mb-4">Panel del taller</h1>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4 col-lg">
            <div class="card tarjeta-resumen"><div class="card-body">
                <div class="text-muted">Clientes</div>
                <div class="numero" th:text="${totalClientes}">0</div>
                <a class="stretched-link small" th:href="@{/clientes}">Ver clientes</a>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg">
            <div class="card tarjeta-resumen"><div class="card-body">
                <div class="text-muted">Vehículos</div>
                <div class="numero" th:text="${totalVehiculos}">0</div>
                <a class="stretched-link small" th:href="@{/vehiculos}">Ver vehículos</a>
            </div></div>
        </div>
        <div class="col-6 col-md-4 col-lg">
            <div class="card tarjeta-resumen" style="border-left-color:#ffc107"><div class="card-body">
                <div class="text-muted">Órdenes abiertas</div>
                <div class="numero" th:text="${ordenesAbiertas}">0</div>
                <a class="stretched-link small" th:href="@{/ordenes(estado='ABIERTA')}">Ver abiertas</a>
            </div></div>
        </div>
        <div class="col-6 col-md-6 col-lg">
            <div class="card tarjeta-resumen"><div class="card-body">
                <div class="text-muted">En reparación</div>
                <div class="numero" th:text="${ordenesEnReparacion}">0</div>
                <a class="stretched-link small" th:href="@{/ordenes(estado='EN_REPARACION')}">Ver en reparación</a>
            </div></div>
        </div>
        <div class="col-6 col-md-6 col-lg">
            <div class="card tarjeta-resumen" style="border-left-color:#198754"><div class="card-body">
                <div class="text-muted">Finalizadas</div>
                <div class="numero" th:text="${ordenesFinalizadas}">0</div>
                <a class="stretched-link small" th:href="@{/ordenes(estado='FINALIZADA')}">Ver finalizadas</a>
            </div></div>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
        <a class="btn btn-primary" th:href="@{/vehiculos/nuevo}">Nuevo vehículo</a>
        <a class="btn btn-success" th:href="@{/ordenes/nueva}">Abrir orden de trabajo</a>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
