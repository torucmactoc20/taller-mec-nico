<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('vehiculos')}"></nav>

<main class="container py-4" style="max-width: 640px;">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <h1 class="h3 mb-3" th:text="${titulo}">Vehículo</h1>

    <form th:action="@{${accion}}" th:object="${form}" method="post" class="card card-body">

        <div class="mb-3" th:unless="${editando}">
            <label for="clienteId" class="form-label">Cliente (dueño)</label>
            <select th:field="*{clienteId}" class="form-select" required>
                <option value="">Seleccione un cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.id}"
                        th:text="${c.apellido + ', ' + c.nombre}">Pérez, Juan</option>
            </select>
        </div>
        <div class="mb-3" th:if="${editando}">
            <label class="form-label">Cliente (dueño)</label>
            <input type="text" class="form-control" disabled
                   th:value="${cliente.apellido + ', ' + cliente.nombre}">
        </div>

        <div class="mb-3">
            <label for="patente" class="form-label">Patente</label>
            <input type="text" th:field="*{patente}" class="form-control" maxlength="10"
                   placeholder="AB123CD" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="marca" class="form-label">Marca</label>
                <input type="text" th:field="*{marca}" class="form-control" maxlength="50" required>
            </div>
            <div class="col-md-6 mb-3">
                <label for="modelo" class="form-label">Modelo</label>
                <input type="text" th:field="*{modelo}" class="form-control" maxlength="50" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="anio" class="form-label">Año</label>
            <input type="number" th:field="*{anio}" class="form-control" min="1950" max="2100" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/vehiculos}">Cancelar</a>
        </div>
    </form>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
