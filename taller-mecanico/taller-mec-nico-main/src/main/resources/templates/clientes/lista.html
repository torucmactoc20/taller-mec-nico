<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Clientes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/clientes}" method="get">
        <div class="col-sm-8 col-md-5">
            <input type="text" name="buscar" class="form-control"
                   placeholder="Buscar por nombre o apellido" th:value="${buscar}">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
            <a class="btn btn-link" th:href="@{/clientes}">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>Apellido y nombre</th>
                <th>Teléfono</th>
                <th>Vehículos</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.apellido + ', ' + c.nombre}">Pérez, Juan</td>
                <td th:text="${c.telefono}">2994001122</td>
                <td th:text="${#lists.size(c.vehiculos)}">0</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/{id}(id=${c.id})}">Ver</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/{id}/editar(id=${c.id})}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{/clientes/{id}/eliminar(id=${c.id})}"
                          onsubmit="return confirm('¿Seguro que desea eliminar este cliente?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="4" class="text-center text-muted py-4">No hay clientes para mostrar.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
