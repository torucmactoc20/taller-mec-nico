<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de cliente')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${cliente.apellido + ', ' + cliente.nombre}">Cliente</h1>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
            <a class="btn btn-outline-dark" th:href="@{/clientes}">Volver</a>
        </div>
    </div>

    <div class="card card-body mb-4">
        <div><strong>Teléfono:</strong> <span th:text="${cliente.telefono}">-</span></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">Vehículos</h2>
        <a class="btn btn-sm btn-primary" th:href="@{/vehiculos/nuevo(clienteId=${cliente.id})}">Agregar vehículo</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle bg-white">
            <thead class="table-dark">
            <tr><th>Patente</th><th>Marca</th><th>Modelo</th><th>Año</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="v : ${cliente.vehiculos}">
                <td th:text="${v.patente}">AB123CD</td>
                <td th:text="${v.marca}">Ford</td>
                <td th:text="${v.modelo}">Fiesta</td>
                <td th:text="${v.anio}">2018</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/vehiculos/{id}(id=${v.id})}">Ver</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(cliente.vehiculos)}">
                <td colspan="5" class="text-center text-muted py-3">El cliente no tiene vehículos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
