<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de vehículo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('vehiculos')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${vehiculo.patente + ' - ' + vehiculo.marca + ' ' + vehiculo.modelo}">Vehículo</h1>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/vehiculos/{id}/editar(id=${vehiculo.id})}">Editar</a>
            <a class="btn btn-outline-dark" th:href="@{/vehiculos}">Volver</a>
        </div>
    </div>

    <div class="card card-body mb-4">
        <div><strong>Año:</strong> <span th:text="${vehiculo.anio}">-</span></div>
        <div>
            <strong>Dueño:</strong>
            <a th:href="@{/clientes/{id}(id=${vehiculo.cliente.id})}"
               th:text="${vehiculo.cliente.apellido + ', ' + vehiculo.cliente.nombre}">Pérez, Juan</a>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">Historial de órdenes de trabajo</h2>
        <a class="btn btn-sm btn-success" th:href="@{/ordenes/nueva(vehiculoId=${vehiculo.id})}">Abrir orden</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped align-middle bg-white">
            <thead class="table-dark">
            <tr><th>Fecha</th><th>Descripción</th><th>Estado</th><th>Costo</th><th class="text-end">Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="o : ${vehiculo.ordenes}">
                <td th:text="${#temporals.format(o.fechaIngreso, 'dd/MM/yyyy')}">01/01/2026</td>
                <td th:text="${o.descripcion}">Cambio de aceite</td>
                <td><span class="badge" th:classappend="${o.estado.claseCss}" th:text="${o.estado.etiqueta}">Abierta</span></td>
                <td th:text="${o.costo > 0 ? '$ ' + #numbers.formatDecimal(o.costo, 1, 'POINT', 2, 'COMMA') : '-'}">-</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/ordenes/{id}(id=${o.id})}">Ver</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(vehiculo.ordenes)}">
                <td colspan="5" class="text-center text-muted py-3">El vehículo no tiene órdenes registradas.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <form class="mt-4" method="post" th:action="@{/vehiculos/{id}/eliminar(id=${vehiculo.id})}"
          onsubmit="return confirm('¿Seguro que desea eliminar este vehículo?');">
        <button class="btn btn-outline-danger" type="submit">Eliminar vehículo</button>
    </form>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
