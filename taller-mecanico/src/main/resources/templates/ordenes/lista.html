<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Órdenes de trabajo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('ordenes')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Órdenes de trabajo</h1>
        <a class="btn btn-success" th:href="@{/ordenes/nueva}">Abrir orden</a>
    </div>

    <form class="row g-2 mb-3" th:action="@{/ordenes}" method="get">
        <div class="col-sm-8 col-md-4">
            <select name="estado" class="form-select">
                <option value="">Todos los estados</option>
                <option th:each="e : ${estados}" th:value="${e.name()}" th:text="${e.etiqueta}"
                        th:selected="${e == estadoSeleccionado}">Abierta</option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-secondary" type="submit">Filtrar</button>
            <a class="btn btn-link" th:href="@{/ordenes}">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
            <thead class="table-dark">
            <tr>
                <th>Fecha</th>
                <th>Vehículo</th>
                <th>Cliente</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Costo</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="${#temporals.format(o.fechaIngreso, 'dd/MM/yyyy')}">01/01/2026</td>
                <td th:text="${o.vehiculo.patente + ' (' + o.vehiculo.marca + ' ' + o.vehiculo.modelo + ')'}">AB123CD</td>
                <td th:text="${o.vehiculo.cliente.apellido + ', ' + o.vehiculo.cliente.nombre}">Pérez, Juan</td>
                <td th:text="${o.descripcion}">Cambio de aceite</td>
                <td><span class="badge" th:classappend="${o.estado.claseCss}" th:text="${o.estado.etiqueta}">Abierta</span></td>
                <td th:text="${o.costo > 0 ? '$ ' + #numbers.formatDecimal(o.costo, 1, 'POINT', 2, 'COMMA') : '-'}">-</td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/ordenes/{id}(id=${o.id})}">Ver</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(ordenes)}">
                <td colspan="7" class="text-center text-muted py-4">No hay órdenes para mostrar.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
