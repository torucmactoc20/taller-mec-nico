spring.application.name=taller-mecanico
server.port=8080
spring.thymeleaf.cache=false

# Base de datos SQL Server (se pueden sobrescribir con variables de entorno DB_URL, DB_USER y DB_PASSWORD)
# Si usan una instancia con nombre (por ejemplo SQL Server Express): jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=TallerMecanico;...
taller.db.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TallerMecanico;encrypt=true;trustServerCertificate=true}
taller.db.user=${DB_USER:taller}
taller.db.password=${DB_PASSWORD:Taller_2026!}

# Poner en true para cargar datos de ejemplo la primera vez (solo si no hay clientes)
taller.cargar-datos-ejemplo=${CARGAR_DATOS_EJEMPLO:false}

logging.level.DataNucleus=WARN
